<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>AI Interview Coach Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-dark shadow">

        <div class="container">

            <span class="navbar-brand mb-0 h1">
                🎯 AI Interview Coach Pro
            </span>

        </div>

    </nav>

    <!-- Main Container -->

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <!-- Role Card -->

                <div class="card shadow-sm mb-4">

                    <div class="card-body">

                        <h3 class="mb-3">
                            Start Mock Interview
                        </h3>

                        <form action="/interview" method="POST">

                            <div class="mb-3">

                                <label class="form-label">
                                    Job Role
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="role"
                                    placeholder="Python Developer"
                                    required>

                            </div>

                            <button
                                class="btn btn-primary w-100">

                                Generate Interview Question

                            </button>

                        </form>

                    </div>

                </div>

                {% if question %}

                <!-- Question Card -->

                <div class="card shadow-sm mb-4">

                    <div class="card-body">

                        <h4 class="text-primary">
                            Interview Question
                        </h4>

                        <hr>

                        <p class="fs-5">
                            {{ question }}
                        </p>

                    </div>

                </div>

                <!-- Answer Card -->

                <div class="card shadow-sm mb-4">

                    <div class="card-body">

                        <h4>
                            Your Answer
                        </h4>

                        <hr>

                        <form action="/interview" method="POST">

                            <input
                                type="hidden"
                                name="role"
                                value="{{ role }}">

                            <input
                                type="hidden"
                                name="question"
                                value="{{ question }}">

                            <textarea
                                class="form-control"
                                name="answer"
                                rows="6"
                                placeholder="Type your answer here..."
                                required></textarea>

                            <br>

                            <button
                                class="btn btn-success w-100">

                                Submit Answer

                            </button>

                        </form>

                    </div>

                </div>

                {% endif %}

                {% if feedback %}

                <!-- Feedback Card -->

                <div class="card shadow-sm border-success">

                    <div class="card-body">

                        <h4 class="text-success">
                            AI Interview Feedback
                        </h4>

                        <hr>

                        <pre style="white-space: pre-wrap;">{{ feedback }}</pre>

                    </div>

                </div>

                {% endif %}

            </div>

        </div>

    </div>

    <!-- Footer -->

    <footer class="text-center mt-5 mb-3 text-muted">

        Built with Flask + Ollama 🤖

    </footer>

</body>

</html>
